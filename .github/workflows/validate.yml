name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checks dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3"
      - name: Validate notebook, scripts, and baseline
        run: python scripts/validate.py
